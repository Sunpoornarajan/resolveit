version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: resolveit-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ResolveIT_Db_Pass_2026}
      MYSQL_DATABASE: resolveit_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-ResolveIT_Db_Pass_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resolveit-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resolveit-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: resolveit_db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-ResolveIT_Db_Pass_2026}
      PORT: 8080
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - resolveit-network

networks:
  resolveit-network:
    driver: bridge

volumes:
  mysql-data:
