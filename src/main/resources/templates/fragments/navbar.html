<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="top-navbar">
    <div class="d-flex align-items-center">
        <h5 class="mb-0 fw-bold text-dark" th:text="${pageTitle}">Dashboard</h5>
    </div>

    <div class="d-flex align-items-center gap-3">
        <div class="text-end" sec:authorize="isAuthenticated()">
            <div class="fw-semibold text-dark" th:text="${currentUser != null ? currentUser.fullName : #authentication.name}">User Name</div>
            <div class="small text-muted">
                <span class="badge bg-secondary" th:text="${currentUser != null ? currentUser.role.displayName : 'User'}">Role</span>
                <span class="ms-1" th:if="${currentUser != null}" th:text="${currentUser.employeeId}">EMP-0000</span>
            </div>
        </div>

        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-danger btn-sm d-flex align-items-center gap-1">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </button>
        </form>
    </div>
</nav>
</body>
</html>
