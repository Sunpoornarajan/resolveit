<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="pagination(page, baseUrl)" th:if="${page != null && page.totalPages > 0}" class="d-flex justify-content-between align-items-center mt-3">
    <div class="text-muted small">
        Showing
        <span class="fw-semibold" th:text="${page.number * page.size + 1}">1</span>
        to
        <span class="fw-semibold" th:text="${(page.number + 1) * page.size > page.totalElements ? page.totalElements : (page.number + 1) * page.size}">10</span>
        of
        <span class="fw-semibold" th:text="${page.totalElements}">50</span>
        incidents
    </div>

    <nav th:if="${page.totalPages > 1}" aria-label="Page navigation">
        <ul class="pagination pagination-sm mb-0">
            <!-- Previous Button -->
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link" th:href="@{${baseUrl}(page=${page.number - 1}, size=${filter.size}, status=${filter.status}, priority=${filter.priority}, category=${filter.category}, departmentId=${filter.departmentId}, assignedToId=${filter.assignedToId}, incidentNumber=${filter.incidentNumber}, keyword=${filter.keyword})}">
                    &laquo; Prev
                </a>
            </li>

            <!-- Page Number Links -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                th:if="${i >= page.number - 2 && i <= page.number + 2}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link"
                   th:href="@{${baseUrl}(page=${i}, size=${filter.size}, status=${filter.status}, priority=${filter.priority}, category=${filter.category}, departmentId=${filter.departmentId}, assignedToId=${filter.assignedToId}, incidentNumber=${filter.incidentNumber}, keyword=${filter.keyword})}"
                   th:text="${i + 1}">1</a>
            </li>

            <!-- Next Button -->
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link" th:href="@{${baseUrl}(page=${page.number + 1}, size=${filter.size}, status=${filter.status}, priority=${filter.priority}, category=${filter.category}, departmentId=${filter.departmentId}, assignedToId=${filter.assignedToId}, incidentNumber=${filter.incidentNumber}, keyword=${filter.keyword})}">
                    Next &raquo;
                </a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
