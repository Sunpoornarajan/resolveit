<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ? ${title} + ' - ResolveIT' : 'ResolveIT - Incident Management System'">ResolveIT</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Application Theme Styles -->
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<div th:fragment="layout(content, title)" class="app-wrapper">
    <!-- Sidebar Navigation -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- Main Content Area -->
    <div class="main-content">
        <!-- Top Navbar -->
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <!-- Body Content -->
        <main class="content-body">
            <!-- Global Flash Messages -->
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Page Specific Content -->
            <div th:replace="${content}"></div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <div class="container-fluid">
                <span>&copy; 2026 ResolveIT &bull; Enterprise IT Incident Management System. All rights reserved.</span>
            </div>
        </footer>
    </div>

    <!-- Optional Bootstrap JS Bundle for UI interaction (modals, dropdowns) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
