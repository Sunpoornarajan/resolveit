<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('User Management')}"></head>
<body>
<div th:replace="~{fragments/layout :: layout(~{::#mainContent}, 'User Management')}">
    <div id="mainContent">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-1">User Directory</h4>
                <p class="text-muted small mb-0">Manage system accounts, assign roles, and handle access credentials.</p>
            </div>
            <a th:href="@{/admin/users/new}" class="btn btn-primary btn-sm">
                <i class="bi bi-person-plus-fill me-1"></i> Add New User
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th class="ps-3">Emp ID</th>
                            <th>Full Name</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Department</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th class="text-end pe-3">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td class="ps-3 fw-bold text-secondary" th:text="${user.employeeId}">EMP-1001</td>
                            <td class="fw-semibold text-dark" th:text="${user.fullName}">John Doe</td>
                            <td><code th:text="${user.username}">johndoe</code></td>
                            <td th:text="${user.email}">john@resolveit.com</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${user.role.name() == 'ADMIN'} ? 'bg-danger' : (${user.role.name() == 'IT_SUPPORT'} ? 'bg-info text-dark' : 'bg-secondary')"
                                      th:text="${user.role.displayName}">Admin</span>
                            </td>
                            <td>
                                <span th:if="${user.department != null}" th:text="${user.department.name}">IT</span>
                                <span th:unless="${user.department != null}" class="text-muted fst-italic">None</span>
                            </td>
                            <td>
                                <span class="badge" th:classappend="${user.active} ? 'bg-success' : 'bg-secondary'"
                                      th:text="${user.active} ? 'Active' : 'Inactive'">Active</span>
                            </td>
                            <td class="small text-muted" th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">Date</td>
                            <td class="text-end pe-3">
                                <div class="d-inline-flex gap-1">
                                    <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-outline-secondary" title="Edit User">
                                        <i class="bi bi-pencil"></i> Edit
                                    </a>
                                    <form th:action="@{/admin/users/toggle-status/{id}(id=${user.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm"
                                                th:classappend="${user.active} ? 'btn-outline-danger' : 'btn-outline-success'"
                                                th:title="${user.active} ? 'Deactivate' : 'Activate'">
                                            <i class="bi" th:classappend="${user.active} ? 'bi-person-x' : 'bi-person-check'"></i>
                                            <span th:text="${user.active} ? 'Deactivate' : 'Activate'">Toggle</span>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="9" class="text-center py-4 text-muted">No users found.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
