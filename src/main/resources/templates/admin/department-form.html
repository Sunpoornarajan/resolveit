<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header(${isEdit ? 'Edit Department' : 'Create Department'})}"></head>
<body>
<div th:replace="~{fragments/layout :: layout(~{::#mainContent}, ${isEdit ? 'Edit Department' : 'Create Department'})}">
    <div id="mainContent">

        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold" th:text="${isEdit ? 'Edit Department' : 'Create New Department'}">Department Form</h5>
                    </div>
                    <div class="card-body p-4">

                        <form th:action="${isEdit ? '/admin/departments/edit/' + deptDto.id : '/admin/departments/new'}"
                              th:object="${deptDto}" method="post">

                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold small">Department Name *</label>
                                <input type="text" id="name" th:field="*{name}" class="form-control"
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                       placeholder="e.g. Quality Assurance" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</div>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label fw-semibold small">Description</label>
                                <textarea id="description" th:field="*{description}" class="form-control" rows="3"
                                          placeholder="Brief description of department scope"></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Error</div>
                            </div>

                            <div class="form-check form-switch mb-4">
                                <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                                <label class="form-check-label fw-semibold small" for="active">Active Department</label>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/admin/departments}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-save me-1"></i>
                                    <span th:text="${isEdit ? 'Update Department' : 'Save Department'}">Save</span>
                                </button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
