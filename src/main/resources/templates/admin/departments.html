<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Department Management')}"></head>
<body>
<div th:replace="~{fragments/layout :: layout(~{::#mainContent}, 'Department Management')}">
    <div id="mainContent">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-1">Company Departments</h4>
                <p class="text-muted small mb-0">Manage organizational departments and business units.</p>
            </div>
            <a th:href="@{/admin/departments/new}" class="btn btn-primary btn-sm">
                <i class="bi bi-building-add me-1"></i> Add Department
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th class="ps-3" style="width: 80px;">ID</th>
                            <th>Department Name</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th class="text-end pe-3">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="dept : ${departments}">
                            <td class="ps-3 fw-bold text-secondary" th:text="${dept.id}">1</td>
                            <td class="fw-semibold text-dark" th:text="${dept.name}">IT</td>
                            <td class="text-muted" th:text="${dept.description}">Information Technology</td>
                            <td>
                                <span class="badge" th:classappend="${dept.active} ? 'bg-success' : 'bg-secondary'"
                                      th:text="${dept.active} ? 'Active' : 'Inactive'">Active</span>
                            </td>
                            <td class="small text-muted" th:text="${#temporals.format(dept.createdAt, 'dd MMM yyyy')}">Date</td>
                            <td class="text-end pe-3">
                                <div class="d-inline-flex gap-1">
                                    <a th:href="@{/admin/departments/edit/{id}(id=${dept.id})}" class="btn btn-sm btn-outline-secondary">
                                        <i class="bi bi-pencil"></i> Edit
                                    </a>
                                    <form th:action="@{/admin/departments/toggle-status/{id}(id=${dept.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm"
                                                th:classappend="${dept.active} ? 'btn-outline-danger' : 'btn-outline-success'">
                                            <i class="bi" th:classappend="${dept.active} ? 'bi-toggle-on' : 'bi-toggle-off'"></i>
                                            <span th:text="${dept.active} ? 'Deactivate' : 'Activate'">Toggle</span>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(departments)}">
                            <td colspan="6" class="text-center py-4 text-muted">No departments configured yet.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
