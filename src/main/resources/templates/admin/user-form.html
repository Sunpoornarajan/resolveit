<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header(${isEdit ? 'Edit User' : 'Create User'})}"></head>
<body>
<div th:replace="~{fragments/layout :: layout(~{::#mainContent}, ${isEdit ? 'Edit User' : 'Create User'})}">
    <div id="mainContent">

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold" th:text="${isEdit ? 'Edit User Profile' : 'Register New User'}">User Form</h5>
                    </div>
                    <div class="card-body p-4">

                        <form th:action="${isEdit ? '/admin/users/edit/' + userDto.id : '/admin/users/new'}"
                              th:object="${userDto}" method="post">

                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label for="employeeId" class="form-label fw-semibold small">Employee ID *</label>
                                    <input type="text" id="employeeId" th:field="*{employeeId}" class="form-control"
                                           th:classappend="${#fields.hasErrors('employeeId')} ? 'is-invalid' : ''"
                                           placeholder="e.g. EMP-1010" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('employeeId')}" th:errors="*{employeeId}">Error</div>
                                </div>
                                <div class="col-md-4">
                                    <label for="firstName" class="form-label fw-semibold small">First Name *</label>
                                    <input type="text" id="firstName" th:field="*{firstName}" class="form-control"
                                           th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">Error</div>
                                </div>
                                <div class="col-md-4">
                                    <label for="lastName" class="form-label fw-semibold small">Last Name *</label>
                                    <input type="text" id="lastName" th:field="*{lastName}" class="form-control"
                                           th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Error</div>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="username" class="form-label fw-semibold small">Username *</label>
                                    <input type="text" id="username" th:field="*{username}" class="form-control"
                                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Error</div>
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label fw-semibold small">Email Address *</label>
                                    <input type="email" id="email" th:field="*{email}" class="form-control"
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</div>
                                </div>
                            </div>

                            <!-- Password Field -->
                            <div class="mb-3" th:if="${!isEdit}">
                                <label for="password" class="form-label fw-semibold small">Initial Password *</label>
                                <input type="password" id="password" th:field="*{password}" class="form-control"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                       placeholder="Minimum 6 characters" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error</div>
                            </div>
                            <div class="mb-3" th:if="${isEdit}">
                                <label for="newPassword" class="form-label fw-semibold small">New Password (leave blank to keep current)</label>
                                <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control"
                                       placeholder="••••••••">
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="role" class="form-label fw-semibold small">Assigned Role *</label>
                                    <select id="role" th:field="*{role}" class="form-select" required>
                                        <option value="">-- Select Role --</option>
                                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r.displayName}">Role</option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('role')}" th:errors="*{role}">Error</div>
                                </div>
                                <div class="col-md-6">
                                    <label for="departmentId" class="form-label fw-semibold small">Department *</label>
                                    <select id="departmentId" th:field="*{departmentId}" class="form-select" required>
                                        <option value="">-- Select Department --</option>
                                        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}">Department</option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}">Error</div>
                                </div>
                            </div>

                            <div class="form-check form-switch mb-4">
                                <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                                <label class="form-check-label fw-semibold small" for="active">Account Active</label>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/admin/users}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-save me-1"></i>
                                    <span th:text="${isEdit ? 'Update User' : 'Save User'}">Save</span>
                                </button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
