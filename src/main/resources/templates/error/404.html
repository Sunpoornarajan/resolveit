<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | ResolveIT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

<div class="text-center p-5 bg-white border rounded shadow-sm" style="max-width: 520px;">
    <div class="text-warning mb-3">
        <i class="bi bi-question-circle display-1"></i>
    </div>
    <h1 class="display-5 fw-bold text-dark mb-2">404</h1>
    <h4 class="text-secondary mb-3">Resource Not Found</h4>
    <p class="text-muted mb-4" th:text="${errorMessage} ?: 'The incident, user, or page you were looking for could not be found.'">
        The incident, user, or page you were looking for could not be found.
    </p>
    <a th:href="@{/}" class="btn btn-primary">
        <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
</div>

</body>
</html>
