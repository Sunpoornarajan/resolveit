<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ResolveIT Incident Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">
    <div class="auth-container">
        <!-- Logo Header -->
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle p-3 mb-3" style="width: 64px; height: 64px;">
                <i class="bi bi-shield-check fs-2"></i>
            </div>
            <h3 class="fw-bold mb-1 text-dark">Resolve<span class="text-primary">IT</span></h3>
            <p class="text-muted small">Enterprise IT Incident Management System</p>
        </div>

        <!-- Error / Logout Alerts -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show small" role="alert">
            <i class="bi bi-exclamation-circle-fill me-1"></i>
            <span th:text="${errorMessage}">Invalid credentials</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${logoutMessage}" class="alert alert-success alert-dismissible fade show small" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i>
            <span th:text="${logoutMessage}">Logged out</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold text-secondary small">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" name="username" class="form-control" placeholder="e.g. admin or employee" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold text-secondary small">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Service Desk
                </button>
            </div>
        </form>

        <!-- Demo Credentials Helper Card -->
        <div class="mt-4 pt-3 border-top">
            <div class="text-muted small fw-bold mb-2 text-uppercase">Demo Credentials:</div>
            <div class="bg-light p-2 rounded small border mb-1">
                <strong>Admin:</strong> <code>admin</code> / <code>Admin@123</code>
            </div>
            <div class="bg-light p-2 rounded small border mb-1">
                <strong>Support:</strong> <code>support</code> / <code>Support@123</code>
            </div>
            <div class="bg-light p-2 rounded small border">
                <strong>Employee:</strong> <code>employee</code> / <code>Employee@123</code>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
